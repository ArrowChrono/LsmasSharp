name: hoe-win64

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hoe-win64.yml
      - .gitmodules
      - third_party/l-smash-works
      - scripts/**
      - src/LsmasNative/**
  pull_request:
    paths:
      - .github/workflows/hoe-win64.yml
      - .gitmodules
      - third_party/l-smash-works
      - scripts/**
      - src/LsmasNative/**

permissions:
  contents: read

jobs:
  build:
    name: build static win64 hoe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout pinned native sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve shared build inputs
        run: python3 scripts/build_hoe_native.py --github-env >> "$GITHUB_ENV"

      - name: Setup pinned Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Test build identity validation
        run: python3 scripts/test_native_build.py

      - name: Cache FFmpeg prefix
        uses: actions/cache@v6
        with:
          path: ${{ env.FFMPEG_PREFIX }}
          key: ffmpeg-hoe-ubuntu24-${{ env.FFMPEG_BUILD_KEY }}

      - name: Build with the shared local entry point
        run: python3 scripts/build_hoe_native.py

      - name: Upload lsmasnative artifact
        uses: actions/upload-artifact@v7
        with:
          name: lsmasnative-win64-hoe
          path: |
            ${{ env.OUT_DIR }}/lsmasnative.dll
            ${{ env.OUT_DIR }}/lsmasnative.pdb
            ${{ env.OUT_DIR }}/build-manifest.json
          if-no-files-found: error

  audio-regression:
    name: verify Windows audio reads
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: lsmasnative-win64-hoe
          path: artifacts/native/win-x64-hoe
      - name: Install media fixture tools
        run: choco install ffmpeg --no-progress -y
      - name: Verify fresh seeks, timeline offsets and complete reads
        run: |
          New-Item -ItemType Directory -Force artifacts/native-audio-tests | Out-Null
          python scripts/test_native_audio_reads.py --native-library artifacts/native/win-x64-hoe/lsmasnative.dll *> artifacts/native-audio-tests/regression.log
          $nativeResult = $LASTEXITCODE
          Get-Content artifacts/native-audio-tests/regression.log
          exit $nativeResult
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-audio-regression
          path: artifacts/native-audio-tests
          if-no-files-found: ignore
